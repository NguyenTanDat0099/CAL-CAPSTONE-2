# CalAI front-door nginx config.
#
# Layout assumed when scaling:
#   - Node backend (Express)  -> 3000, 3001, 3002 ...
#   - Cal-AI FastAPI          -> 8000, 8001 ...
#   - Ollama LLM instances    -> 11434, 11435 ...
#
# Drop this file into /etc/nginx/sites-available/calai and symlink to
# sites-enabled. Run `nginx -t && systemctl reload nginx` after edits.

# Per-IP rate limit so a single client cannot saturate the LLM queue.
limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

# ----- upstream pools -----
# `least_conn` is better than round-robin for AI workloads where individual
# requests have very different durations.
upstream calai_backend {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=15s backup;
    keepalive 32;
}

upstream calai_python {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream calai_ollama {
    # Ollama serializes per GPU, so distribute across multiple instances.
    least_conn;
    server 127.0.0.1:11434 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:11435 max_fails=2 fail_timeout=30s;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Bigger upload window for image analysis.
    client_max_body_size 12m;

    # Default proxy hardening.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Static frontend (build output).
    root /var/www/calai/frontend;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Node backend handles auth + chat orchestration.
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://calai_backend;
        proxy_read_timeout 60s;
    }

    # FastAPI service (Agentic RAG, vision, food analysis).
    location /ai/ {
        limit_req zone=chat_zone burst=20 nodelay;
        rewrite ^/ai/(.*) /$1 break;
        proxy_pass http://calai_python;
        # LLM calls can take a long time; allow up to 4 minutes per request.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;            # stream tokens through if enabled
    }

    # Optional: expose Ollama directly behind the same balancer for clients
    # that talk to the LLM through the front door.
    location /llm/ {
        rewrite ^/llm/(.*) /$1 break;
        proxy_pass http://calai_ollama;
        proxy_read_timeout 240s;
        proxy_buffering off;
    }

    # Cheap healthz so external monitors can poll without hitting upstreams.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
